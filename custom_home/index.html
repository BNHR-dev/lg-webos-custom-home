<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    color: #fff; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  /* ---- fallback: procedural starry gradient, used until/unless a real photo loads ---- */
  #sky {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(90,60,40,0.35) 0%, rgba(90,60,40,0) 55%),
      linear-gradient(180deg, #05060c 0%, #0a0e1c 45%, #1b1f2e 100%);
  }
  #skyphoto {
    position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center;
    background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');
  }
  #skydim {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.45) 40%, rgba(0,0,0,0.8) 100%);
  }
  #stars, #stars2, #stars3 { position: absolute; inset: 0; z-index: 1; transition: opacity 1s; }

  .shooting-star {
    position: absolute; top: 18%; left: 55%; width: 140px; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
    transform: rotate(-20deg);
    opacity: 0.8;
  }

  .content { position: relative; z-index: 2; width: 100%; height: 100%; }

  .clock { position: absolute; top: 60px; left: 70px; }
  .time { font-size: 92px; font-weight: 600; letter-spacing: -2px; line-height: 1; text-shadow: 0 2px 20px rgba(0,0,0,0.5); }
  .date { font-size: 26px; font-weight: 400; color: #c9ccd6; margin-top: 10px; text-shadow: 0 1px 10px rgba(0,0,0,0.5); }

  .sections { position: absolute; left: 50px; right: 50px; bottom: 80px; }
  .section { margin-bottom: 20px; }
  .label { font-size: 18px; color: #c9ccd6; letter-spacing: 3px; margin-bottom: 4px; padding-left: 20px; text-transform: uppercase; font-weight: 600; }
  /* rows scroll horizontally to keep the focused tile in view; padding gives
     the focused tile's scale/shadow room so overflow doesn't clip it */
  .row { display: flex; gap: 22px; padding: 14px 20px 22px; overflow-x: hidden; scroll-behavior: smooth; }
  .row > * { flex-shrink: 0; }

  .tile {
    width: 210px; height: 118px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    position: relative; border: 3px solid transparent;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    overflow: hidden; background-size: cover; background-position: center;
  }
  .tile img { width: 60px; height: 60px; object-fit: contain; }
  .tile .fallback { font-size: 20px; font-weight: 700; color: #fff; }
  .wordmark { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.5px; text-align: center; line-height: 1.15; }
  .wordmark.script { font-weight: 800; font-style: italic; }
  .wordmark small { display: block; font-size: 0.6em; font-weight: 500; opacity: 0.9; }
  .tile.focused { transform: scale(1.08); border-color: #ffffff; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .tile, .tile * { outline: none !important; -webkit-tap-highlight-color: transparent; }
  .tile svg, .tile img { pointer-events: none; -webkit-user-select: none; user-select: none; }

  .tile-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile-label {
    font-size: 15px; font-weight: 500; color: #9aa3b2; text-align: center;
    transition: color .15s, font-weight .15s;
  }
  .tile-wrap.focused .tile-label { color: #fff; font-weight: 600; }

  .console-icon { width: 56px; height: 56px; flex-shrink: 0; }
  .yt-badge svg { width: 60px; height: auto; }
  .icon60 svg { width: 60px; height: 60px; display: block; }
  .disney-badge svg { width: 150px; height: auto; display: block; }
  .now-badge svg { width: 150px; height: auto; display: block; }
  .console-icon-wrap svg { width: 56px; height: 56px; display: block; }

  .tile.input-tile {
    width: 320px; height: 118px; justify-content: flex-start; align-items: center;
    padding: 0 26px; gap: 20px;
  }
  .input-text { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .input-name { font-size: 20px; font-weight: 700; color: #fff; }
  .input-sub { font-size: 14px; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 7px; }
  .input-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }

  .input-tile.full-badge { padding: 0; justify-content: center; }
  .full-badge-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .full-badge-wrap svg { width: 65%; height: auto; display: block; }
  .hdmi-chip {
    position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: #fff;
    background: rgba(0,0,0,0.4); padding: 3px 9px; border-radius: 6px;
    display: flex; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

  <div id="sky"></div>
  <div id="skyphoto"></div>
  <div id="skydim"></div>
  <canvas id="stars" style="position:absolute;inset:0;z-index:1;"></canvas>
  <div class="shooting-star"></div>

  <div class="content">
    <div class="clock">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date">Day 0 Month</div>
    </div>

    <div class="sections">
      <div class="section">
        <div class="label">Apps</div>
        <div class="row" id="apps-row"></div>
      </div>
      <div class="section">
        <div class="label">Inputs</div>
        <div class="row" id="inputs-row"></div>
      </div>
    </div>

  </div>

<script>
  // ---- starfield (procedural canvas, no image fetch) ----
  (function() {
    var c = document.getElementById("stars");
    var ctx = c.getContext("2d");
    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      draw();
    }
    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      var seed = 42;
      function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      for (var i = 0; i < 260; i++) {
        var x = rand() * c.width;
        var y = rand() * c.height * 0.75;
        var r = rand() * 1.4 + 0.3;
        var a = rand() * 0.6 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
        ctx.fill();
      }
    }
    window.addEventListener("resize", resize);
    resize();
  })();

  // ---- clock ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function updateClock() {
    var d = new Date();
    document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById("date").textContent = days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()];
  }
  updateClock();
  setInterval(updateClock, 10000);

  // ---- luna bridge ----
  function callLuna(uri, params) {
    try {
      var bridge = new PalmServiceBridge();
      bridge.onservicecallback = function(msg) {
        try {
          var resp = JSON.parse(msg);
          if (!resp.returnValue) console.log("luna call failed: " + uri + " " + msg);
        } catch (e) {}
      };
      bridge.call(uri, JSON.stringify(params));
    } catch (e) {
      console.log("PalmServiceBridge unavailable: " + e);
    }
  }
  function launchApp(appId) {
    callLuna("luna://com.webos.applicationManager/launch", { id: appId });
  }

    '<path fill-rule="evenodd" clip-rule="evenodd" d="M26.4025 24.3435C26.4025 17.5893 26.4178 12.0511 26.4383 12.0357C26.4536 12.0153 27.4754 12 28.7016 12C30.4795 12 31.0313 12.0153 31.389 12.0766C34.0559 12.5364 36.0842 14.5443 36.59 17.2061C36.6615 17.5791 36.6717 18.4528 36.6717 24.3129C36.6717 30.5732 36.6792 31.3096 36.4818 31.9862C36.4477 32.1031 36.4075 32.2182 36.3601 32.3597C36.2732 32.61 36.1046 33.0136 35.9769 33.2538C34.9806 35.1288 33.1516 36.3907 31.0773 36.6258C30.5868 36.6768 26.6222 36.6973 26.4842 36.6462C26.4076 36.6155 26.4025 35.4864 26.4025 24.3435ZM33.6114 24.7574C33.3457 23.9808 32.6918 23.3728 31.8948 23.1633C30.6175 22.8312 29.2891 23.5669 28.9059 24.8187C28.7782 25.2172 28.7731 25.8711 28.8855 26.2594C29.2585 27.5265 30.6175 28.298 31.8948 27.9659C32.6816 27.7564 33.2946 27.1893 33.6063 26.382C33.7749 25.9427 33.78 25.2376 33.6114 24.7574Z" fill="white"/>' +

  var inputs = [
    { id: "com.webos.app.hdmi1", name: "PlayStation", hdmi: "HDMI 1", bg: "linear-gradient(135deg,#1f3a93,#2a5db0)", svg: PS_SVG },
    { id: "com.webos.app.hdmi2", name: "Mac Mini",    hdmi: "HDMI 2", bg: "linear-gradient(135deg,#4b4f58,#71757e)", svg: APPLE_SVG },
    { id: "com.webos.app.hdmi3", name: "Nintendo Switch", hdmi: "HDMI 3", bg: "linear-gradient(135deg,#8c1d1d,#e8442e)", svg: NINTENDO_SVG }
  ];

  function fillIcon(el, opts) {
    if (opts.wordmark) {
      el.insertAdjacentHTML("afterbegin", opts.wordmark);
    } else if (opts.icon) {
      var img = document.createElement("img");
      img.src = opts.icon;
      img.onerror = function() {
        img.remove();
        var fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = opts.name || opts.id;
        el.insertBefore(fb, el.firstChild);
      };
      el.appendChild(img);
    } else if (opts.svg) {
      el.insertAdjacentHTML("afterbegin", opts.svg);
    }
  }

  // App tile: icon-only tile + a label below it (dim, brightens on focus)
  function makeAppTile(opts) {
    var wrap = document.createElement("div");
    wrap.className = "tile-wrap";

    var el = document.createElement("div");
    el.className = "tile";
    el.tabIndex = 0;
    el.style.background = opts.bg;
    fillIcon(el, opts);
    el.addEventListener("click", function() { launchApp(opts.id); });
    el.addEventListener("keydown", function(e) { if (e.key === "Enter") launchApp(opts.id); });

    var label = document.createElement("div");
    label.className = "tile-label";
    label.textContent = opts.name || "";

    wrap.appendChild(el);
    wrap.appendChild(label);
    wrap._tile = el;
    wrap._label = label;
    return wrap;
  }

  // Input tile: icon + name/HDMI text all inside one wide gradient tile.
  // Some logos (Nintendo) are a full wordmark badge instead - those fill the
  // tile and just get a small HDMI chip overlaid in the corner.
  function makeInputTile(opts) {
    var el = document.createElement("div");
    el.className = "tile input-tile" + (opts.fullBadge ? " full-badge" : "");
    el.tabIndex = 0;
    el.style.background = opts.bg;

    if (opts.fullBadge) {
      el.insertAdjacentHTML("afterbegin", opts.fullBadge);
      var chip = document.createElement("div");
      chip.className = "hdmi-chip";
      chip.innerHTML = '<span class="input-dot"></span>' + opts.hdmi;
      el.appendChild(chip);
    } else {
      fillIcon(el, opts);
      var textBlock = document.createElement("div");
      textBlock.className = "input-text";
      textBlock.innerHTML =
        '<div class="input-name">' + opts.name + '</div>' +
        '<div class="input-sub"><span class="input-dot"></span>' + opts.hdmi + '</div>';
      el.appendChild(textBlock);
    }
    el.addEventListener("click", function() { launchApp(opts.id); });
    el.addEventListener("keydown", function(e) { if (e.key === "Enter") launchApp(opts.id); });
    return el;
  }

  var appsRow = document.getElementById("apps-row");
  var appTileWraps = apps.map(function(a) {
    var w = makeAppTile(a);
    appsRow.appendChild(w);
    return w;
  });

  var inputsRow = document.getElementById("inputs-row");
  inputs.forEach(function(i) { inputsRow.appendChild(makeInputTile(i)); });

  // ---- focus / remote navigation ----
  // Row-based groups: 0 = apps, 1 = inputs.
  var groups = [
    appTileWraps,
    Array.prototype.slice.call(inputsRow.children)
  ];
  var curGroup = 0, curIndex = 0;

  function clearFocus(item) {
    (item._tile || item).classList.remove("focused");
    item.classList.remove("focused");
  }
  function scrollRowToTile(tileEl) {
    var rowEl = tileEl.parentElement;
    while (rowEl && !rowEl.classList.contains("row")) rowEl = rowEl.parentElement;
    if (!rowEl) return;
    var wrapEl = tileEl.closest ? tileEl.closest(".tile-wrap") : null;
    var targetEl = wrapEl || tileEl;
    var targetLeft = targetEl.offsetLeft;
    var targetRight = targetLeft + targetEl.offsetWidth;
    var viewLeft = rowEl.scrollLeft;
    var viewRight = viewLeft + rowEl.clientWidth;
    if (targetLeft < viewLeft) {
      rowEl.scrollTo({ left: targetLeft - 20, behavior: "smooth" });
    } else if (targetRight > viewRight) {
      rowEl.scrollTo({ left: targetRight - rowEl.clientWidth + 20, behavior: "smooth" });
    }
  }
  function applyFocus() {
    groups.forEach(function(g) { g.forEach(clearFocus); });
    var item = groups[curGroup][curIndex];
    item.classList.add("focused");
    var tileEl = (item._tile || item);
    tileEl.classList.add("focused");
    tileEl.focus();
    scrollRowToTile(item);
  }
  function moveRow(delta) {
    var next = Math.max(0, Math.min(groups.length - 1, curGroup + delta));
    if (next === curGroup) return;
    curGroup = next;
    curIndex = Math.max(0, Math.min(groups[curGroup].length - 1, curIndex));
    applyFocus();
  }
  function moveCol(delta) {
    curIndex = Math.max(0, Math.min(groups[curGroup].length - 1, curIndex + delta));
    applyFocus();
  }
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") { moveCol(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { moveCol(-1); e.preventDefault(); }
    else if (e.key === "ArrowDown") { moveRow(1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { moveRow(-1); e.preventDefault(); }
  });
  applyFocus();
</script>
